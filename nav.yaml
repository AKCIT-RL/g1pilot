nav2point:
  ros__parameters:
    vx_limit: 0.3   # forward/backward, m/s
    vy_limit: 0.0   # lateral, m/s
    wz_limit: 0.5   # angular velocity (rad/s)

    # Position PID (world frame), used while driving toward a waypoint.
    pos_kp: 0.8
    pos_ki: 0.05
    pos_kd: 0.15
    pos_integral_limit: 0.3   # bounds the accumulator itself

    # Heading PID for normal waypoint tracking (aligning + steering).
    yaw_kp: 1.5
    yaw_ki: 0.1
    yaw_kd: 0.1
    yaw_integral_limit: 0.3

    # Separate, gentler heading PID used only for the final orientation fix-up.
    final_wz_limit: 0.3
    final_yaw_kp: 0.8
    final_yaw_ki: 0.05
    final_yaw_kd: 0.05
    final_yaw_integral_limit: 0.3

    align_enter_deg: 20.0   # heading error to start rotating in place
    align_exit_deg: 8.0     # heading error to resume driving

    goal_tolerance: 0.20    # position tolerance to the goal, meters -- must match dijkstra_planner's below

dijkstra_planner:
  ros__parameters:
    goal_orientation_tolerance_deg: 8.0  # heading tolerance before the mission counts as done
    goal_tolerance: 0.20          # position tolerance to the final waypoint, meters
    inflation_radius_m: 0.60      # safety margin added around obstacles when planning

    check_horizon_dist: 1.0    # meters ahead checked for a blocking obstacle
    check_start_dist: 0.15     # safety margin behind the robot where the check starts

    recovery_sleep_duration: 3.0   # seconds between recovery attempts after a failed replan
    max_recovery_attempts: 3       # attempts before giving up on the active goal

    shortcut_check_interval_s: 5.0        # how often to look for a shorter path
    shortcut_min_improvement_pct: 15.0    # min improvement to switch to it

    debug: false    # verbose per-tick path-check logging

    home_x: -1.7658712809264392
    home_y: -0.9606552024251439
    home_yaw_deg: 115.92385811133641

    # Geofence polygon, flat [x1,y1,x2,y2,...] in perimeter order -- capture with RViz's
    # "Publish Point" tool. Empty disables the check.
    geofence_points: [2.4, 1.5,
                       2.8, -0.8,
                       -3.5, -2.0,
                       -3.8, 0.2]
    geofence_check_interval_s: 1.0    # seconds between checks
    geofence_resend_interval_s: 5.0   # retry interval once outside the geofence

    pose_publish_rate_hz: 10.0   # Hz for /g1pilot/robot_pose

pcl_to_grid:
  ros__parameters:
    relocalize_x: -1.766
    relocalize_y: -0.961
    relocalize_yaw_deg: 115.924
    relocalize_range_m: 2.0         # 1-sigma position search radius, meters
    relocalize_yaw_range_deg: 15.0  # 1-sigma yaw search range, degrees
